[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 0
debug = 0
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

[workspace.dependencies]
axum = "0.8.9"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.6.11", features = ["fs"] }
surrealdb = "4.0.0"
surrealdb-types = { version = "4.0.0", default-features = false }
uuid = "1.29.1"
