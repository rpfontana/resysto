[workspace]
resolver = "3"
# a glob over crates/ would also match the group folders, which have no manifest
members = [
    "crates/auth",
    "crates/config",
    "crates/http",
    "crates/id",
    "crates/mcp",
    "crates/model",
    "crates/server",
    "crates/core/*",
    "crates/db/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 0
debug = 0
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-client-ip = "1.3.1"
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-test = "21.1.0"
base64 = "0.22.1"
cedar-policy = { version = "4.14.1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.27", default-features = false }
futures-util = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1.2.3"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = "1.0.229"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "request-id", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
surrealdb = "4.0.0"
surrealdb-types = { version = "4.0.0", default-features = false }
unicode-normalization = "0.1.26"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["preserve_order", "preserve_path_order", "uuid"] }
utoipa-axum = "0.3.0"
uuid = "1.29.1"
validator = { version = "0.21.0", features = ["derive"] }
