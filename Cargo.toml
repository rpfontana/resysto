[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 0
debug = 0
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
leptos = { version = "0.8.23" }
leptos_meta = { version = "0.8.7" }
leptos_router = { version = "0.8.17" }
leptos_axum = { version = "0.8.10" }

axum = "0.8.9"
cfg-if = "1.0.5"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
http = "1.5.0"
log = "0.4.35"
serde = "1.0.229"
simple_logger = "5.2.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["full"] }
uuid = "1.29.1"
wasm-bindgen = "0.2.130"

# See https://github.com/leptos-rs/cargo-leptos for documentation of all the parameters
[[workspace.metadata.leptos]]
name = "resysto"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
hash-files = true
lib-profile-release = "wasm-release"
style-file = "style/main.scss"
assets-dir = "public"
browserquery = "defaults"
watch = false
env = "DEV"

site-addr = "127.0.0.1:3000"
reload-port = 3001

bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false
