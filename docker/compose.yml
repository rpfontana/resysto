name: resysto-v2

services:
  surrealdb:
    image: surrealdb/surrealdb:v4.0.0
    command: start
    ports:
      - "127.0.0.1:${SURREAL_PORT:-18000}:8000"
    environment:
      SURREAL_PATH: surrealkv:/data/resysto
      SURREAL_USER: root
      SURREAL_PASS: root
      SURREAL_NO_DEFAULTS: "true"
      SURREAL_IMPORT_FILE: /init.surql
      # For unbatched writes
      SURREAL_TRANSACTION_MAX_WRITE_KEYS: "20000"
    volumes:
      - surrealdb:/data
      - ./init.surql:/init.surql:ro
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  surrealdb:
